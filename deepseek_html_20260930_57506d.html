<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIM FONG N TIGA — Order Bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f4f1ea;
         display: flex; justify-content: center; align-items: center;
         min-height: 100vh; padding: 16px; }
  .chat-container { width: 100%; max-width: 480px; height: 90vh; max-height: 720px;
    background: #fff; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    display: flex; flex-direction: column; overflow: hidden; }
  .header { background: #8b1a1a; color: #fff; padding: 16px 20px; text-align: center; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header p { font-size: 12px; opacity: 0.85; margin-top: 3px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex;
    flex-direction: column; gap: 12px; background: #faf8f4; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #8b1a1a; color: #fff;
    border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #fff; color: #222;
    border: 1px solid #e8e2d8; border-bottom-left-radius: 4px; }
  .msg.bot .meta { display: block; margin-top: 8px; padding-top: 8px;
    border-top: 1px dashed #ddd; font-size: 11px; color: #999;
    font-family: ui-monospace, monospace; }
  .msg.typing { color: #999; font-style: italic; }
  .input-bar { display: flex; gap: 8px; padding: 12px; background: #fff;
    border-top: 1px solid #eee; }
  .input-bar input { flex: 1; padding: 12px 16px; border: 1px solid #ddd;
    border-radius: 24px; font-size: 14px; outline: none; }
  .input-bar input:focus { border-color: #8b1a1a; }
  .input-bar button { padding: 0 20px; background: #8b1a1a; color: #fff;
    border: none; border-radius: 24px; font-size: 14px; font-weight: 600;
    cursor: pointer; }
  .input-bar button:hover { background: #6d1414; }
  .input-bar button:disabled { background: #ccc; cursor: not-allowed; }
  .quick-chips { display: flex; gap: 6px; padding: 0 12px 10px;
    flex-wrap: wrap; background: #fff; }
  .chip { font-size: 12px; padding: 5px 11px; background: #f4f1ea;
    color: #555; border-radius: 12px; cursor: pointer;
    border: 1px solid #e8e2d8; }
  .chip:hover { background: #8b1a1a; color: #fff; border-color: #8b1a1a; }
</style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h1>🍜 KIM FONG N TIGA</h1>
    <p>Order Bot — Test Mode</p>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Hi! Welcome to Restoran KIM FONG N TIGA. What would you like to order? 😊</div>
  </div>

  <div class="quick-chips">
    <span class="chip">Kopi O big, ais</span>
    <span class="chip">Milo normal</span>
    <span class="chip">Teh O dabao</span>
    <span class="chip">Nescafe big</span>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type your order..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  // Same-origin since we serve the HTML from FastAPI
  const API_URL = "/chat";

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  document.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      inputEl.value = chip.textContent;
      sendMessage();
    });
  });

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
  });

  function addMessage(text, sender, meta = null) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    if (meta) {
      const m = document.createElement("span");
      m.className = "meta";
      m.textContent = meta;
      div.appendChild(m);
    }
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    addMessage(text, "user");
    inputEl.value = "";
    inputEl.disabled = true;
    sendBtn.disabled = true;

    const typing = addMessage("Thinking...", "bot typing");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      typing.remove();

      let meta = null;
      if (data.tool_used && data.tool_result) {
        meta = `🔧 ${data.tool_used}(${JSON.stringify(data.tool_result)})`;
      }
      addMessage(data.reply || "(no reply)", "bot", meta);
    } catch (err) {
      typing.remove();
      addMessage("⚠️ Error: " + err.message, "bot");
    } finally {
      inputEl.disabled = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>

</body>
</html>
